<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserve a Seat | Hungry Head</title>
    <style>
      :root {
        --ink: #1b211e;
        --orange: #ee6c38;
        --yellow: #f3c969;
        --paper: #fbfaf6;
        --line: #d9d5c9;
        --muted: #69716a;
        --serif: Georgia, serif;
        --sans: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--yellow);
        color: var(--ink);
        font-family: var(--sans);
      }

      .reservation-card {
        width: min(100%, 520px);
        padding: 38px;
        background: var(--paper);
        box-shadow: 0 18px 45px rgba(27, 33, 30, 0.14);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--orange);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font: 600 clamp(38px, 8vw, 58px)/1 var(--serif);
      }

      h1 em {
        color: var(--orange);
      }

      .intro {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.6;
      }

      form {
        display: grid;
        gap: 17px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      input,
      select {
        width: 100%;
        padding: 13px 0;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font: 15px var(--sans);
        outline: 0;
      }

      input:focus,
      select:focus {
        border-color: var(--orange);
      }

      button {
        margin-top: 8px;
        padding: 15px 20px;
        border: 0;
        background: var(--ink);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover {
        background: var(--orange);
      }

      .message {
        min-height: 18px;
        margin: 0;
        color: var(--orange);
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 520px) {
        .reservation-card {
          padding: 28px 22px;
        }
        .form-row {
          grid-template-columns: 1fr;
          gap: 17px;
        }
      }
    </style>
  </head>
  <body>
    <main class="reservation-card">
      <p class="eyebrow">Hungry Head Restaurant · Varanasi RC</p>
      <h1>Reserve your <em>seat.</em></h1>
      <p class="intro">
        Choose your date, time, and party size. We will confirm your table
        shortly.
      </p>

      <form id="seat-reservation-form">
        <label>
          Your name
          <input
            name="name"
            type="text"
            placeholder="Enter your name"
            required
          />
        </label>

        <label>
          Mobile number
          <input
            name="phone"
            type="tel"
            placeholder="+91 98765 43210"
            required
          />
        </label>

        <div class="form-row">
          <label>
            Date
            <input name="date" type="date" required />
          </label>
          <label>
            Time
            <input name="time" type="time" required />
          </label>
        </div>

        <label>
          Number of seats
          <select name="seats" required>
            <option value="1">1 seat</option>
            <option value="2" selected>2 seats</option>
            <option value="3">3 seats</option>
            <option value="4">4 seats</option>
            <option value="5">5 seats</option>
            <option value="6">6+ seats</option>
          </select>
        </label>

        <button type="submit">Reserve my seat</button>
        <p class="message" id="reservation-message" role="status"></p>
      </form>
    </main>

    <script>
      const form = document.getElementById("seat-reservation-form");
      const message = document.getElementById("reservation-message");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const reservation = Object.fromEntries(new FormData(form));
        const reservations = JSON.parse(
          localStorage.getItem("hungryHeadSeatReservations") || "[]",
        );

        reservations.push({
          ...reservation,
          createdAt: new Date().toISOString(),
        });
        localStorage.setItem(
          "hungryHeadSeatReservations",
          JSON.stringify(reservations),
        );
        message.textContent = `Thank you, ${reservation.name}. Your seat request has been received.`;
        form.reset();
      });
    </script>
  </body>
</html>
